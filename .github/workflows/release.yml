name: Build and Release BO3 Shader Studio

on:
  push:
    branches:
      - main
    # Documentation-only edits should not compile or publish a tester update.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      # CI/release-plumbing-only edits do not change the application binary,
      # so do not compile or publish a tester update for them by themselves.
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Visible version override (leave blank to use version.json, e.g. 0.1)'
        required: false
        default: ''
        type: string
      channel:
        description: 'Update channel'
        required: true
        default: tester
        type: choice
        options:
          - tester
          - stable
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string

permissions:
  contents: write

# If several commits land on main while a tester build is still running, only
# publish the newest one. Manual releases are kept separate from push builds.
concurrency:
  group: bo3-shader-studio-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Two commits is enough for the normal one-push-at-a-time workflow.
          # If GitHub cannot supply the previous commit, the packaging step
          # conservatively falls back to a full runtime update.
          fetch-depth: 2

      - name: Resolve release metadata
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DISPLAY_VERSION: ${{ inputs.version }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
          MANUAL_NOTES: ${{ inputs.notes }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $sourceVersionPath = Join-Path $env:GITHUB_WORKSPACE 'version.json'
          $sourceVersion = Get-Content -LiteralPath $sourceVersionPath -Raw | ConvertFrom-Json
          $displayVersion = [string]$sourceVersion.displayVersion
          if ([string]::IsNullOrWhiteSpace($displayVersion)) { $displayVersion = '0.1' }

          $fastTester = $false
          $leanUpdate = $false
          # Manual/full releases validate everything. Automatic tester pushes
          # are narrowed below from the changed-file set.
          $runGlsl = $true
          $runShadertoy = $true
          $runPostfx = $true
          $runPackage = $true

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if (-not [string]::IsNullOrWhiteSpace($env:MANUAL_DISPLAY_VERSION)) {
              $displayVersion = $env:MANUAL_DISPLAY_VERSION.Trim()
            }
            $channel = $env:MANUAL_CHANNEL.Trim().ToLowerInvariant()
            $notes = $env:MANUAL_NOTES
          }
          else {
            # Pushes to main are automatic tester updates. They use compiler
            # caching and, when runtime dependencies have not changed, a small
            # delta-style update payload instead of resending the Qt runtime.
            # Regression suites are selected from the changed-file set so a
            # converter-only patch avoids unrelated BO3 package coverage while
            # still running GLSL, Shadertoy, and PostFX tests owned by the
            # converter module.
            $channel = 'tester'
            $fastTester = $true
            $leanUpdate = $true
            $runGlsl = $false
            $runShadertoy = $false
            $runPostfx = $false
            $runPackage = $false
            $shortSha = $env:COMMIT_SHA.Substring(0, 7)
            $commitMessage = $env:COMMIT_MESSAGE
            if ([string]::IsNullOrWhiteSpace($commitMessage)) { $commitMessage = 'Automatic tester update.' }
            $firstLine = ($commitMessage -split "`r?`n")[0].Trim()
            $notes = "### What's changed`n$firstLine`n`nBuild: ``$shortSha``"

            # A project-file or release-workflow change can alter which Qt DLLs
            # are required. In that case keep the fast compiler cache, but ship
            # a full runtime update for safety. If the diff cannot be resolved,
            # also choose the safe full payload.
            $before = $env:BEFORE_SHA
            $canDiff = -not [string]::IsNullOrWhiteSpace($before) -and $before -notmatch '^0+$'
            if ($canDiff) {
              git cat-file -e "$before^{commit}" 2>$null
              $canDiff = ($LASTEXITCODE -eq 0)
            }
            if ($canDiff) {
              $changed = @(git diff --name-only $before $env:COMMIT_SHA)
              Write-Host 'Changed files:'
              $changed | ForEach-Object { Write-Host "  $_" }

              function Enable-AllRegressions {
                $script:runGlsl = $true
                $script:runShadertoy = $true
                $script:runPostfx = $true
                $script:runPackage = $true
              }

              foreach ($path in $changed) {
                $normalized = $path.Replace('\','/')

                # Build-layout changes can alter runtime contents and source
                # boundaries. Keep the full update payload and full validation.
                if ($normalized -eq 'BO3HLSLPreviewer.pro') {
                  $leanUpdate = $false
                  Enable-AllRegressions
                  continue
                }

                # The workflow/package plumbing itself does not change shader
                # semantics, so it needs a build/package smoke path but no
                # shader regression suite.
                if ($normalized -eq '.github/workflows/release.yml' -or
                    $normalized -match '^tools/' -or
                    $normalized -eq 'version.json') {
                  if ($normalized -eq '.github/workflows/release.yml') { $leanUpdate = $false }
                  continue
                }

                # GLSL conversion and optimization. This module also owns the
                # generated Material/PostFX/Sky wrappers, so converter changes
                # must keep PostFX export coverage in addition to GLSL and
                # Shadertoy conversion tests.
                if ($normalized -match '^src/glsl_converter_core\.(cpp|h)$' -or
                    $normalized -match '^tests/glsl_converter/') {
                  $runGlsl = $true
                  $runShadertoy = $true
                  $runPostfx = $true
                  continue
                }

                if ($normalized -match '^src/shadertoy_project\.(cpp|h)$' -or
                    $normalized -match '^tests/shadertoy_project_converter/') {
                  $runShadertoy = $true
                  continue
                }

                # BO3 package/adapters/reflection/techset/export contract.
                if ($normalized -match '^src/bo3_' -or
                    $normalized -match '^src/preview_package_session\.(cpp|h)$' -or
                    $normalized -match '^tests/bo3_package/' -or
                    $normalized -match '^bo3_compat/' -or
                    $normalized -match '^export_templates/') {
                  $runPackage = $true
                  if ($normalized -match 'postfx') { $runPostfx = $true }
                  continue
                }

                # PostFX-specific preview/export behavior.
                if ($normalized -match '^src/hlsl_preview_mode\.(cpp|h)$' -or
                    $normalized -match '^tests/postfx') {
                  $runPostfx = $true
                  continue
                }

                # Renderer and main-window changes are broad/cross-target. They
                # are less common than converter fixes, so keep all suites here.
                if ($normalized -match '^src/(preview_renderer|main_window|main)\.(cpp|h)$') {
                  Enable-AllRegressions
                  continue
                }

                # Updater, model import, live capture, and TinyEXR changes are
                # compile/runtime features outside the shader regression suites.
                if ($normalized -match '^src/(github_update|model_import|live_window_capture|tinyexr_impl)\.(cpp|h)$') {
                  continue
                }

                # Shared include resolution can influence several shader paths.
                if ($normalized -eq 'src/shader_include_handler.h') {
                  Enable-AllRegressions
                  continue
                }

                # Known data/sample/resource-only changes do not require shader
                # semantic regression runs.
                if ($normalized -match '^(resources|presets|shaders|updates)/') {
                  continue
                }

                # Any unclassified source/test/build file gets the conservative
                # full suite instead of accidentally skipping relevant coverage.
                if ($normalized -match '^(src|tests)/' -or
                    $normalized -match '\.(cpp|h|hpp|c|cc|pro)$') {
                  Enable-AllRegressions
                }
              }
            }
            else {
              Write-Host 'Previous commit is unavailable; using a full runtime update payload and full regressions for safety.'
              $leanUpdate = $false
              $runGlsl = $true
              $runShadertoy = $true
              $runPostfx = $true
              $runPackage = $true
            }
          }

          if ($displayVersion -notmatch '^\d+(?:\.\d+){0,2}$') {
            throw "Invalid visible version: $displayVersion"
          }
          if ($channel -notin @('stable','tester')) { throw "Invalid channel: $channel" }

          # This is deliberately hidden from normal UI. It only orders updates.
          # run_number increases for every workflow run, including automatic pushes.
          $updateVersion = "1.0.${{ github.run_number }}"
          "RELEASE_VERSION=$updateVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BO3_FAST_TESTER=$([int]$fastTester)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BO3_LEAN_UPDATE=$([int]$leanUpdate)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BO3_RUN_GLSL=$([int]$runGlsl)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BO3_RUN_SHADERTOY=$([int]$runShadertoy)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BO3_RUN_POSTFX=$([int]$runPostfx)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BO3_RUN_PACKAGE=$([int]$runPackage)" | Out-File -FilePath $env:GITHUB_ENV -Append

          $notesPath = Join-Path $env:RUNNER_TEMP 'bo3_release_notes.md'
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "BO3 Shader Studio $displayVersion`n`nAutomated $channel build."
          }
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          "RELEASE_NOTES_FILE=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Visible version: $displayVersion"
          Write-Host "Update channel: $channel"
          Write-Host "Internal ordering version: $updateVersion"
          Write-Host "Fast tester compile cache: $fastTester"
          Write-Host "Lean tester update payload: $leanUpdate"
          Write-Host "Regression selection: GLSL=$runGlsl Shadertoy=$runShadertoy PostFX=$runPostfx Package=$runPackage"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up C++ compiler cache
        if: env.BO3_FAST_TESTER == '1'
        id: sccache_setup
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.16.0'

      - name: Stamp GitHub update metadata
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'version.json'
          $json = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          $json.version = $env:RELEASE_VERSION
          if (-not ($json.PSObject.Properties.Name -contains 'displayVersion')) { $json | Add-Member -NotePropertyName displayVersion -NotePropertyValue $env:RELEASE_DISPLAY_VERSION }
          else { $json.displayVersion = $env:RELEASE_DISPLAY_VERSION }
          if (-not ($json.PSObject.Properties.Name -contains 'displayProduct')) { $json | Add-Member -NotePropertyName displayProduct -NotePropertyValue 'BO3 Shader Studio' }
          else { $json.displayProduct = 'BO3 Shader Studio' }
          $json.githubRepository = '${{ github.repository }}'
          $json.updateAssetPrefix = 'BO3_Shader_Studio_Update'
          $json.defaultUpdateChannel = $env:RELEASE_CHANNEL
          $json | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $path -Encoding UTF8

      - name: Build Windows runtime
        id: build_runtime
        shell: cmd
        env:
          BO3_CI_FAST: ${{ env.BO3_FAST_TESTER }}
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
        run: tools\ci_build_release.cmd

      - name: Show compiler-cache statistics
        if: always() && env.BO3_FAST_TESTER == '1' && steps.build_runtime.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SCCACHE_PATH) -and (Test-Path -LiteralPath $env:SCCACHE_PATH)) {
            & $env:SCCACHE_PATH --show-stats
          }
          else {
            sccache --show-stats
          }

      # Automatic tester pushes run only the regression suites relevant to the
      # changed subsystem. Manual/stable releases still select all four above.
      - name: Run GLSL regression suite
        if: env.BO3_RUN_GLSL == '1'
        id: glsl_regression
        continue-on-error: true
        shell: cmd
        run: dist\BO3HLSLPreviewer.exe --regression-all

      - name: Run Shadertoy regression suite
        if: env.BO3_RUN_SHADERTOY == '1'
        id: shadertoy_regression
        continue-on-error: true
        shell: cmd
        run: dist\BO3HLSLPreviewer.exe --shadertoy-regression-all

      - name: Run PostFX export regression suite
        if: env.BO3_RUN_POSTFX == '1'
        id: postfx_regression
        continue-on-error: true
        shell: cmd
        run: dist\BO3HLSLPreviewer.exe --postfx-export-regression-all

      - name: Run BO3 package regression suite
        if: env.BO3_RUN_PACKAGE == '1'
        id: package_regression
        continue-on-error: true
        shell: cmd
        run: dist\BO3HLSLPreviewer.exe --bo3-package-regression-all

      - name: Regression gate
        if: always()
        shell: pwsh
        env:
          BUILD_RESULT: ${{ steps.build_runtime.outcome }}
          RUN_GLSL: ${{ env.BO3_RUN_GLSL }}
          RUN_SHADERTOY: ${{ env.BO3_RUN_SHADERTOY }}
          RUN_POSTFX: ${{ env.BO3_RUN_POSTFX }}
          RUN_PACKAGE: ${{ env.BO3_RUN_PACKAGE }}
          GLSL_RESULT: ${{ steps.glsl_regression.outcome }}
          SHADERTOY_RESULT: ${{ steps.shadertoy_regression.outcome }}
          POSTFX_RESULT: ${{ steps.postfx_regression.outcome }}
          PACKAGE_RESULT: ${{ steps.package_regression.outcome }}
        run: |
          Write-Host ("Windows runtime build: {0}" -f $env:BUILD_RESULT)
          if ($env:BUILD_RESULT -ne 'success') {
            throw "Windows runtime build failed before regression testing. Expand the 'Build Windows runtime' step for the compiler/build error; skipped suites are not test failures."
          }

          $checks = @(
            [pscustomobject]@{ Name='GLSL';        Enabled=($env:RUN_GLSL -eq '1');       Result=$env:GLSL_RESULT },
            [pscustomobject]@{ Name='Shadertoy';  Enabled=($env:RUN_SHADERTOY -eq '1');  Result=$env:SHADERTOY_RESULT },
            [pscustomobject]@{ Name='PostFX';      Enabled=($env:RUN_POSTFX -eq '1');     Result=$env:POSTFX_RESULT },
            [pscustomobject]@{ Name='BO3 package'; Enabled=($env:RUN_PACKAGE -eq '1');   Result=$env:PACKAGE_RESULT }
          )

          foreach ($check in $checks) {
            if ($check.Enabled) {
              Write-Host ("{0}: {1}" -f $check.Name, $check.Result)
            }
            else {
              Write-Host ("{0}: not selected for this scoped tester change" -f $check.Name)
            }
          }

          $selected = @($checks | Where-Object { $_.Enabled })
          if ($selected.Count -eq 0) {
            Write-Host 'No shader regression suite was required for this change; successful Windows build is the smoke gate.'
            exit 0
          }

          $notRun = @($selected | Where-Object { $_.Result -in @('skipped','cancelled','') })
          if ($notRun.Count -gt 0) {
            throw ("Selected regression suites did not run: " + (($notRun | ForEach-Object { $_.Name }) -join ', '))
          }

          $failed = @($selected | Where-Object { $_.Result -ne 'success' })
          if ($failed.Count -gt 0) {
            throw ("Selected regression suites failed: " + (($failed | ForEach-Object { $_.Name }) -join ', '))
          }

      - name: Create release package
        shell: pwsh
        run: |
          if ($env:BO3_FAST_TESTER -eq '1' -and $env:BO3_LEAN_UPDATE -eq '1') {
            Write-Host 'Creating lean automatic tester update (no duplicate Qt runtime/full distribution ZIP).'
            .\tools\package_github_release.ps1 `
              -Version $env:RELEASE_VERSION `
              -DisplayVersion $env:RELEASE_DISPLAY_VERSION `
              -Channel $env:RELEASE_CHANNEL `
              -Repository '${{ github.repository }}' `
              -NotesFile $env:RELEASE_NOTES_FILE `
              -UpdateOnly `
              -LeanPayload
          }
          elseif ($env:BO3_FAST_TESTER -eq '1') {
            Write-Host 'Runtime/build configuration changed; creating a full update payload, but skipping the duplicate fresh-install ZIP.'
            .\tools\package_github_release.ps1 `
              -Version $env:RELEASE_VERSION `
              -DisplayVersion $env:RELEASE_DISPLAY_VERSION `
              -Channel $env:RELEASE_CHANNEL `
              -Repository '${{ github.repository }}' `
              -NotesFile $env:RELEASE_NOTES_FILE `
              -UpdateOnly
          }
          else {
            Write-Host 'Manual release: creating complete update and fresh-install distributions.'
            .\tools\package_github_release.ps1 `
              -Version $env:RELEASE_VERSION `
              -DisplayVersion $env:RELEASE_DISPLAY_VERSION `
              -Channel $env:RELEASE_CHANNEL `
              -Repository '${{ github.repository }}' `
              -NotesFile $env:RELEASE_NOTES_FILE
          }

      # Automatic tester releases are already stored as GitHub Release assets,
      # so uploading a second copy as a workflow artifact only wastes time and
      # bandwidth. Keep workflow artifacts for deliberate manual/full releases.
      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BO3-Shader-Studio-${{ env.RELEASE_DISPLAY_VERSION }}
          path: release_artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $assets = Get-ChildItem -LiteralPath release_artifacts -File | Where-Object { $_.Name -ne 'release_notes.md' } | ForEach-Object { $_.FullName }
          $args = @('release','create',$tag,'--title',"BO3 Shader Studio $env:RELEASE_DISPLAY_VERSION",'--notes-file',(Join-Path $PWD 'release_artifacts\release_notes.md'),'--target','${{ github.sha }}')
          if ($env:RELEASE_CHANNEL -eq 'tester') { $args += '--prerelease' }
          $args += $assets
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
